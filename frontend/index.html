<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/nexomark-icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14283f" />
    <meta
      name="description"
      content="Dicta la idea de una campaña, la IA crea copy e imagen, tu cliente aprueba esa versión y se publica en Instagram y Facebook."
    />
    <script>
      // Aplica el tema guardado antes de pintar para evitar el destello claro.
      try {
        var t = localStorage.getItem('marketmind_theme')
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Overpass:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>NexoMark IA — De la idea dictada al post publicado</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
