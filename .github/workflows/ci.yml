name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: backend/requirements/ci.txt
      - name: Install PDF system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install locked test environment
        run: |
          python -m pip install --require-hashes -r backend/requirements/ci.txt -r backend/requirements/ci.in
          python -m pip check
      - name: Check models, migrations and tests without network access
        run: python scripts/ci/check_backend.py
      - name: Collect Django test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: django-tests
          path: ci-artifacts/django.xml
          retention-days: 7

  spring:
    name: Spring compile, tests and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.2'
          cache: maven
          cache-dependency-path: springboot/pom.xml
      - name: Verify and package (never use failure-never)
        run: |
          mvn --version
          mvn --batch-mode --no-transfer-progress -DfailIfNoTests=true -f springboot/pom.xml clean verify
      - name: Collect Spring test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spring-tests
          path: springboot/target/surefire-reports/TEST-*.xml
          retention-days: 7

  react:
    name: React lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://127.0.0.1:8000
      VITE_USER_API_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  workflows:
    name: n8n JSON and embedded-secret checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - name: Test the static validator and inspect the workflow export
        run: |
          python -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python scripts/ci/check_n8n.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - name: Test the legal site preparer (allowlist, links and deletion page)
        run: node --test scripts/prepare-legal-site.test.mjs
